[package]
name = "softui-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "softui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# desktop：带 GUI 的 Tauri 应用（原行为）
# server ：无 GUI 的 HTTP 网关，不编译 tauri，因而也不需要 webkit2gtk
[features]
default = ["desktop"]
desktop = ["tauri", "tauri-build", "tauri-plugin-opener"]
server = []

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level = 2
debug = false
strip = true
